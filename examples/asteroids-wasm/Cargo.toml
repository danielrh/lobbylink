[package]
name = "asteroids-wasm"
version = "0.1.0"
edition = "2021"
description = "DartRoids in the browser, in Rust: lobbylink's wasm client + Canvas 2D, wire-compatible with the TS and native examples"

[lib]
crate-type = ["cdylib"]

[dependencies]
p2p-lobby-client = { path = "../../clients/rust" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
futures = "0.3"
bytes = "1"
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "CanvasRenderingContext2d",
    "Performance",
    "Event",
    "EventTarget",
    "KeyboardEvent",
    "PointerEvent",
    "MouseEvent",
    "DomRect",
    "CssStyleDeclaration",
    "console",
    "TextMetrics",
] }

[profile.release]
opt-level = 1
