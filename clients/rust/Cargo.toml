[package]
name = "p2p-lobby-client"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "lobbylink client: P2P lobby over WebSocket signaling + WebRTC DataChannels (native and wasm32 browser)"

[lib]
name = "p2p_lobby_client"
# lib only: on wasm32 the HOST project owns the cdylib + wasm-bindgen step.
crate-type = ["lib"]

# Shared dependencies (must all build on wasm32-unknown-unknown).
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
bytes = "1"
futures-channel = "0.3"
futures-core = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "net"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
webrtc = "0.17"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["full"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "BinaryType",
    "CloseEvent",
    "MessageEvent",
    "WebSocket",
    "Window",
    "Storage",
    "console",
    "RtcPeerConnection",
    "RtcConfiguration",
    "RtcIceServer",
    "RtcIceTransportPolicy",
    "RtcDataChannel",
    "RtcDataChannelInit",
    "RtcDataChannelType",
    "RtcDataChannelState",
    "RtcSessionDescription",
    "RtcSessionDescriptionInit",
    "RtcSdpType",
    "RtcIceCandidate",
    "RtcIceCandidateInit",
    "RtcPeerConnectionIceEvent",
    "RtcPeerConnectionState",
    "RtcSignalingState",
    "RtcStatsReport",
] }
