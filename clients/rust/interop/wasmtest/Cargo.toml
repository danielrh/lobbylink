[package]
name = "wasmtest"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
p2p-lobby-client = { path = "../.." }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "Window"] }
bytes = "1"

[profile.release]
opt-level = 1
